spring.application.name=pizzaria87

# Banco H2 salvo em arquivo local (não perde dados ao reiniciar)
spring.datasource.url=jdbc:h2:file:./data/pizzaria87db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilita o painel visual do banco em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Garante que o data.sql rode depois que o Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always