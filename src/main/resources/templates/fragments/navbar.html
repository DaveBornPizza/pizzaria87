<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="topbar(usuarioLogado)">
    <div class="p87-checker-bar"></div>
    <nav class="navbar navbar-expand-lg navbar-dark p87-navbar mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/login}">
                <img th:src="@{/images/logo-pizzaria87.png}" alt="Logo Pizzaria 87" class="p87-logo-img">
                <span>Pizzaria '87</span>
            </a>

            <div class="navbar-nav me-auto" th:if="${usuarioLogado != null and usuarioLogado.cargo == 'ADMINISTRADOR'}">
                <a class="nav-link" th:href="@{/admin/funcionarios}">Funcionários</a>
                <a class="nav-link" th:href="@{/admin/cardapio}">Cardápio</a>
                <a class="nav-link" th:href="@{/admin/fichas}">Fichas</a>
            </div>

            <div class="d-flex align-items-center text-light gap-3" th:if="${usuarioLogado != null}">
                <th:block th:if="${sino != null}"><div th:replace="~{fragments/sino-notificacoes :: sino}"></div></th:block>
                <span class="small">
                    <i class="bi bi-person-circle me-1"></i>
                    <strong th:text="${usuarioLogado.nome}">Usuário</strong>
                </span>
                <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-right me-1"></i> Sair
                </a>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
