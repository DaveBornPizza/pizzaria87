<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="p87-theme">

<div th:replace="~{fragments/navbar :: topbar(${usuarioLogado})}"></div>

<div class="container px-3 py-4">
    <div class="card p87-card mx-auto" style="max-width: 420px;">
        <div class="card-header text-center">
            Acesso ao Sistema de Fichas e Pedidos
        </div>
        <div class="card-body p-4">
            <div th:if="${erro}" class="alert alert-danger d-flex align-items-center py-2 px-3 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erro}">Mensagem de erro</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="identificador" class="form-label fw-semibold">Identificador</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text"
                               class="form-control"
                               id="identificador"
                               name="identificador"
                               th:value="${identificador}"
                               placeholder="Ex.: william, mike01"
                               required
                               autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="pinAcesso" class="form-label fw-semibold">PIN de Acesso</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password"
                               class="form-control"
                               id="pinAcesso"
                               name="pinAcesso"
                               maxlength="4"
                               pattern="[0-9]{4}"
                               inputmode="numeric"
                               placeholder="••••"
                               required>
                    </div>
                    <div class="form-text text-light opacity-75">Digite seu PIN numérico de 4 dígitos.</div>
                </div>

                <button type="submit" class="btn p87-btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
