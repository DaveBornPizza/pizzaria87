<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pizzaria '87</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 1rem;
        }
        .brand-badge {
            width: 64px;
            height: 64px;
            background-color: #dc3545;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1rem auto;
        }
    </style>
</head>
<body>

<div class="container px-3">
    <div class="card shadow-sm login-card mx-auto">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-badge shadow-sm">
                    <i class="bi bi-fire"></i>
                </div>
                <h1 class="h4 fw-bold mb-1">Pizzaria '87</h1>
                <p class="text-muted small mb-0">Acesso ao Sistema de Fichas e Pedidos</p>
            </div>

            <!-- Alerta de erro (credenciais inválidas ou usuário inativo) -->
            <div th:if="${erro}" class="alert alert-danger d-flex align-items-center py-2 px-3 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erro}">Mensagem de erro</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="identificador" class="form-label fw-semibold">Identificador</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text"
                               class="form-control"
                               id="identificador"
                               name="identificador"
                               th:value="${identificador}"
                               placeholder="Ex.: william, mike01"
                               required
                               autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="pinAcesso" class="form-label fw-semibold">PIN de Acesso</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password"
                               class="form-control"
                               id="pinAcesso"
                               name="pinAcesso"
                               maxlength="4"
                               pattern="[0-9]{4}"
                               inputmode="numeric"
                               placeholder="••••"
                               required>
                    </div>
                    <div class="form-text">Digite seu PIN numérico de 4 dígitos.</div>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Entrar
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
