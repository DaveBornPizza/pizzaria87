<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichas - Admin | Pizzaria '87</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/funcionarios}">
            <i class="bi bi-fire text-danger me-1"></i> Pizzaria '87 <span class="badge bg-danger ms-1">Admin</span>
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/admin/funcionarios}">Funcionários</a>
            <a class="nav-link" th:href="@{/admin/cardapio}">Cardápio</a>
            <a class="nav-link active" th:href="@{/admin/fichas}">Fichas</a>
        </div>
        <div class="d-flex align-items-center text-light gap-3">
            <span class="small" th:if="${usuarioLogado != null}">
                <i class="bi bi-person-circle me-1"></i>
                <strong th:text="${usuarioLogado.nome}">Admin</strong>
            </span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right me-1"></i> Sair
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gerenciar Fichas</h1>
        <div class="d-flex gap-2">
            <span class="badge bg-success fs-6">Livres: <span th:text="${totalLivres}">0</span></span>
            <span class="badge bg-warning text-dark fs-6">Ocupadas: <span th:text="${totalOcupadas}">0</span></span>
            <span class="badge bg-secondary fs-6">Desativadas: <span th:text="${totalDesativadas}">0</span></span>
        </div>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulário de Cadastro -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Nova Ficha</div>
                <div class="card-body">
                    <form th:action="@{/admin/fichas/salvar}" method="post">
                        <div class="mb-3">
                            <label for="numeroFicha" class="form-label">Número da Ficha</label>
                            <input type="number" id="numeroFicha" name="numeroFicha"
                                   class="form-control" min="1" step="1"
                                   placeholder="Ex.: 7" required>
                            <div class="form-text">A ficha será criada automaticamente com status LIVRE.</div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">
                            <i class="bi bi-plus-circle me-1"></i> Cadastrar Ficha
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Grade de Fichas -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Fichas Cadastradas</div>
                <div class="card-body">
                    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3">
                        <div class="col" th:each="ficha : ${fichas}">
                            <div class="card h-100 border text-center"
                                 th:classappend="${ficha.status == 'LIVRE'} ? 'border-success' : (${ficha.status == 'OCUPADA'} ? 'border-warning' : 'border-secondary')">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <div class="fs-4 fw-bold mb-1" th:text="${'Ficha ' + ficha.numeroFicha}">Ficha 1</div>
                                        <span class="badge mb-3"
                                              th:text="${ficha.status}"
                                              th:classappend="${ficha.status == 'LIVRE'} ? 'bg-success' : (${ficha.status == 'OCUPADA'} ? 'bg-warning text-dark' : 'bg-secondary')">
                                            LIVRE
                                        </span>
                                    </div>

                                    <form th:if="${ficha.status != 'OCUPADA'}"
                                          th:action="@{/admin/fichas/status/{numero}(numero=${ficha.numeroFicha})}"
                                          method="post">
                                        <button type="submit"
                                                class="btn btn-sm w-100"
                                                th:classappend="${ficha.status == 'LIVRE'} ? 'btn-outline-secondary' : 'btn-outline-success'"
                                                th:text="${ficha.status == 'LIVRE'} ? 'Desativar' : 'Ativar'">
                                            Desativar
                                        </button>
                                    </form>

                                    <button th:if="${ficha.status == 'OCUPADA'}"
                                            type="button"
                                            class="btn btn-sm btn-outline-warning w-100"
                                            disabled
                                            title="Ficha ocupada não pode ser desativada">
                                        Em uso
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
