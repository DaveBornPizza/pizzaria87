<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - Admin | Pizzaria '87</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/funcionarios">
            <i class="bi bi-fire text-danger me-1"></i> Pizzaria '87 <span class="badge bg-danger ms-1">Admin</span>
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" th:href="@{/admin/funcionarios}">Funcionários</a>
            <a class="nav-link" th:href="@{/admin/cardapio}">Cardápio</a>
            <a class="nav-link" th:href="@{/admin/fichas}">Fichas</a>
        </div>
        <div class="d-flex align-items-center text-light gap-3">
            <span class="small" th:if="${usuarioLogado != null}">
                <i class="bi bi-person-circle me-1"></i>
                <strong th:text="${usuarioLogado.nome}">Admin</strong>
            </span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right me-1"></i> Sair
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gerenciar Funcionários</h1>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulário de Cadastro / Edição -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold"
                     th:text="${editando != null and editando} ? 'Editar Funcionário' : 'Novo Funcionário'">
                    Novo Funcionário
                </div>
                <div class="card-body">
                    <form th:action="${editando != null and editando} ? @{/admin/funcionarios/atualizar/{id}(id=${funcionarioForm.id})} : @{/admin/funcionarios/salvar}"
                          th:object="${funcionarioForm}"
                          method="post">

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="identificador" class="form-label">Identificador</label>
                            <input type="text" id="identificador" th:field="*{identificador}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="pinAcesso" class="form-label">PIN (4 dígitos)</label>
                            <input type="text" id="pinAcesso" th:field="*{pinAcesso}" class="form-control"
                                   maxlength="4" pattern="\d{4}" inputmode="numeric" required>
                        </div>

                        <div class="mb-3">
                            <label for="cargo" class="form-label">Cargo</label>
                            <select id="cargo" th:field="*{cargo}" class="form-select" required>
                                <option value="">Selecione...</option>
                                <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                                <option value="GARCOM">GARCOM</option>
                                <option value="COZINHEIRO">COZINHEIRO</option>
                            </select>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
                            <label class="form-check-label" for="ativo">Cadastro ativo</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger flex-grow-1">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${editando != null and editando} ? 'Atualizar' : 'Cadastrar'">Cadastrar</span>
                            </button>
                            <a th:if="${editando != null and editando}"
                               th:href="@{/admin/funcionarios}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela de Funcionários -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Equipe Cadastrada</div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Identificador</th>
                            <th>Cargo</th>
                            <th>Status</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="func : ${funcionarios}">
                            <td th:text="${func.nome}">Nome</td>
                            <td><code th:text="${func.identificador}">id</code></td>
                            <td><span class="badge bg-secondary" th:text="${func.cargo}">CARGO</span></td>
                            <td>
                                <span th:if="${func.ativo}" class="badge bg-success">Ativo</span>
                                <span th:unless="${func.ativo}" class="badge bg-danger">Inativo</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/funcionarios/editar/{id}(id=${func.id})}"
                                       class="btn btn-sm btn-outline-primary"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <th:block th:if="${usuarioLogado == null or usuarioLogado.id != func.id}">
                                        <form th:action="@{/admin/funcionarios/status/{id}(id=${func.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit"
                                                    class="btn btn-sm"
                                                    th:classappend="${func.ativo} ? 'btn-outline-warning' : 'btn-outline-success'"
                                                    th:title="${func.ativo} ? 'Desativar' : 'Ativar'">
                                                <i class="bi" th:classappend="${func.ativo} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                                            </button>
                                        </form>

                                        <form th:action="@{/admin/funcionarios/excluir/{id}(id=${func.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Confirmar exclusão (ou desativação caso haja histórico)?');">
                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                    title="Excluir">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </th:block>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
