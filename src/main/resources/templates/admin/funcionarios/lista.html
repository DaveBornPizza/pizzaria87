<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Gerenciar Funcionários')}"></head>
<body class="p87-theme">

<div th:replace="~{fragments/navbar :: topbar(${usuarioLogado})}"></div>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gerenciar Funcionários</h1>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulário de Cadastro / Edição -->
        <div class="col-lg-4">
            <div class="card p87-card">
                <div class="card-header"
                     th:text="${editando != null and editando} ? 'Editar Funcionário' : 'Novo Funcionário'">
                    Novo Funcionário
                </div>
                <div class="card-body">
                    <!-- Formulário de Edição -->
                    <form th:if="${editando != null and editando}"
                          th:action="@{/admin/funcionarios/atualizar/{id}(id=${funcionarioForm.id})}"
                          th:object="${funcionarioForm}"
                          method="post">

                        <div class="mb-3">
                            <label for="nomeEdit" class="form-label">Nome</label>
                            <input type="text" id="nomeEdit" th:field="*{nome}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="identificadorEdit" class="form-label">Identificador</label>
                            <input type="text" id="identificadorEdit" th:field="*{identificador}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="pinAcessoEdit" class="form-label">PIN (4 dígitos)</label>
                            <input type="text" id="pinAcessoEdit" th:field="*{pinAcesso}" class="form-control"
                                   maxlength="4" pattern="\d{4}" inputmode="numeric" required>
                        </div>

                        <div class="mb-3">
                            <label for="cargoEdit" class="form-label">Cargo</label>
                            <select id="cargoEdit" th:field="*{cargo}" class="form-select" required>
                                <option value="">Selecione...</option>
                                <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                                <option value="GARCOM">GARCOM</option>
                                <option value="COZINHEIRO">COZINHEIRO</option>
                            </select>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="ativoEdit" th:field="*{ativo}">
                            <label class="form-check-label" for="ativoEdit">Cadastro ativo</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn p87-btn-primary flex-grow-1">
                                <i class="bi bi-save me-1"></i> Atualizar
                            </button>
                            <a th:href="@{/admin/funcionarios}" class="btn btn-outline-light">
                                Cancelar
                            </a>
                        </div>
                    </form>

                    <!-- Formulário de Novo Cadastro -->
                    <form th:unless="${editando != null and editando}"
                          th:action="@{/admin/funcionarios/salvar}"
                          th:object="${funcionarioForm}"
                          method="post">

                        <div class="mb-3">
                            <label for="nomeNovo" class="form-label">Nome</label>
                            <input type="text" id="nomeNovo" th:field="*{nome}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="identificadorNovo" class="form-label">Identificador</label>
                            <input type="text" id="identificadorNovo" th:field="*{identificador}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="pinAcessoNovo" class="form-label">PIN (4 dígitos)</label>
                            <input type="text" id="pinAcessoNovo" th:field="*{pinAcesso}" class="form-control"
                                   maxlength="4" pattern="\d{4}" inputmode="numeric" required>
                        </div>

                        <div class="mb-3">
                            <label for="cargoNovo" class="form-label">Cargo</label>
                            <select id="cargoNovo" th:field="*{cargo}" class="form-select" required>
                                <option value="">Selecione...</option>
                                <option value="ADMINISTRADOR">ADMINISTRADOR</option>
                                <option value="GARCOM">GARCOM</option>
                                <option value="COZINHEIRO">COZINHEIRO</option>
                            </select>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="ativoNovo" th:field="*{ativo}">
                            <label class="form-check-label" for="ativoNovo">Cadastro ativo</label>
                        </div>

                        <button type="submit" class="btn p87-btn-primary w-100">
                            <i class="bi bi-save me-1"></i> Cadastrar
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela de Funcionários -->
        <div class="col-lg-8">
            <div class="card p87-card">
                <div class="card-header">Equipe Cadastrada</div>
                <div class="table-responsive">
                    <table class="table table-hover p87-table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Identificador</th>
                            <th>Cargo</th>
                            <th>Status</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="func : ${funcionarios}">
                            <td th:text="${func.nome}">Nome</td>
                            <td><code th:text="${func.identificador}">id</code></td>
                            <td><span class="badge bg-secondary" th:text="${func.cargo}">CARGO</span></td>
                            <td>
                                <span th:if="${func.ativo}" class="badge bg-success">Ativo</span>
                                <span th:unless="${func.ativo}" class="badge bg-danger">Inativo</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/funcionarios/editar/{id}(id=${func.id})}"
                                       class="btn btn-sm btn-outline-warning"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <th:block th:if="${usuarioLogado == null or usuarioLogado.id != func.id}">
                                        <form th:action="@{/admin/funcionarios/status/{id}(id=${func.id})}"
                                              method="post" class="d-inline">
                                            <button type="submit"
                                                    class="btn btn-sm"
                                                    th:classappend="${func.ativo} ? 'btn-outline-light' : 'btn-outline-success'"
                                                    th:title="${func.ativo} ? 'Desativar' : 'Ativar'">
                                                <i class="bi" th:classappend="${func.ativo} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                                            </button>
                                        </form>

                                        <form th:action="@{/admin/funcionarios/excluir/{id}(id=${func.id})}"
                                              method="post" class="d-inline"
                                              onsubmit="return confirm('Confirmar exclusão (ou desativação caso haja histórico)?');">
                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                    title="Excluir">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </th:block>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
