<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Gerenciar Cardápio')}"></head>
<body class="p87-theme">

<div th:replace="~{fragments/navbar :: topbar(${usuarioLogado})}"></div>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gerenciar Cardápio</h1>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulário de Cadastro / Edição -->
        <div class="col-lg-4">
            <div class="card p87-card">
                <div class="card-header"
                     th:text="${editando != null and editando} ? 'Editar Item' : 'Novo Item do Cardápio'">
                    Novo Item do Cardápio
                </div>
                <div class="card-body">
                    <!-- Formulário de Edição -->
                    <form th:if="${editando != null and editando}"
                          th:action="@{/admin/cardapio/atualizar/{id}(id=${itemForm.id})}"
                          th:object="${itemForm}"
                          method="post">

                        <div class="mb-3">
                            <label for="nomeEdit" class="form-label">Nome</label>
                            <input type="text" id="nomeEdit" th:field="*{nome}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoriaEdit" class="form-label">Categoria</label>
                            <input type="text" id="categoriaEdit" th:field="*{categoria}" class="form-control"
                                   list="categoriasSugeridas" required>
                        </div>

                        <div class="mb-3">
                            <label for="precoEdit" class="form-label">Preço (R$)</label>
                            <input type="number" id="precoEdit" th:field="*{preco}" class="form-control"
                                   step="0.01" min="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label for="descricaoEdit" class="form-label">Descrição</label>
                            <textarea id="descricaoEdit" th:field="*{descricao}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="disponivelEdit" th:field="*{disponivel}">
                            <label class="form-check-label" for="disponivelEdit">Disponível para pedidos</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn p87-btn-primary flex-grow-1">
                                <i class="bi bi-save me-1"></i> Atualizar
                            </button>
                            <a th:href="@{/admin/cardapio}" class="btn btn-outline-light">
                                Cancelar
                            </a>
                        </div>
                    </form>

                    <!-- Formulário de Novo Cadastro -->
                    <form th:unless="${editando != null and editando}"
                          th:action="@{/admin/cardapio/salvar}"
                          th:object="${itemForm}"
                          method="post">

                        <div class="mb-3">
                            <label for="nomeNovo" class="form-label">Nome</label>
                            <input type="text" id="nomeNovo" th:field="*{nome}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoriaNovo" class="form-label">Categoria</label>
                            <input type="text" id="categoriaNovo" th:field="*{categoria}" class="form-control"
                                   list="categoriasSugeridas" placeholder="Ex.: Pizzas, Bebidas, Sobremesas" required>
                        </div>

                        <div class="mb-3">
                            <label for="precoNovo" class="form-label">Preço (R$)</label>
                            <input type="number" id="precoNovo" th:field="*{preco}" class="form-control"
                                   step="0.01" min="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label for="descricaoNovo" class="form-label">Descrição</label>
                            <textarea id="descricaoNovo" th:field="*{descricao}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="disponivelNovo" th:field="*{disponivel}">
                            <label class="form-check-label" for="disponivelNovo">Disponível para pedidos</label>
                        </div>

                        <button type="submit" class="btn p87-btn-primary w-100">
                            <i class="bi bi-save me-1"></i> Cadastrar
                        </button>
                    </form>

                    <datalist id="categoriasSugeridas">
                        <option value="Pizzas">
                        <option value="Porções">
                        <option value="Bebidas">
                        <option value="Sobremesas">
                    </datalist>
                </div>
            </div>
        </div>

        <!-- Tabela de Itens -->
        <div class="col-lg-8">
            <div class="card p87-card">
                <div class="card-header">Itens Cadastrados</div>
                <div class="table-responsive">
                    <table class="table table-hover p87-table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Disponibilidade</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${itens}">
                            <td>
                                <div class="fw-semibold" th:text="${item.nome}">Item</div>
                                <small class="text-light opacity-75" th:text="${item.descricao}">Descrição</small>
                            </td>
                            <td><span class="badge bg-secondary" th:text="${item.categoria}">Categoria</span></td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(item.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                            <td>
                                <span th:if="${item.disponivel}" class="badge bg-success">Disponível</span>
                                <span th:unless="${item.disponivel}" class="badge bg-warning text-dark">Indisponível</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/cardapio/editar/{id}(id=${item.id})}"
                                       class="btn btn-sm btn-outline-warning"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <form th:action="@{/admin/cardapio/disponibilidade/{id}(id=${item.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${item.disponivel} ? 'btn-outline-light' : 'btn-outline-success'"
                                                th:title="${item.disponivel} ? 'Marcar indisponível' : 'Marcar disponível'">
                                            <i class="bi" th:classappend="${item.disponivel} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                        </button>
                                    </form>

                                    <form th:action="@{/admin/cardapio/excluir/{id}(id=${item.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Confirmar exclusão (ou desativação caso já tenha sido pedido)?');">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Excluir">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
