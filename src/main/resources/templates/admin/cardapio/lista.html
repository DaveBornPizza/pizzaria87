<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Admin | Pizzaria '87</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/funcionarios}">
            <i class="bi bi-fire text-danger me-1"></i> Pizzaria '87 <span class="badge bg-danger ms-1">Admin</span>
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/admin/funcionarios}">Funcionários</a>
            <a class="nav-link active" th:href="@{/admin/cardapio}">Cardápio</a>
            <a class="nav-link" th:href="@{/admin/fichas}">Fichas</a>
        </div>
        <div class="d-flex align-items-center text-light gap-3">
            <span class="small" th:if="${usuarioLogado != null}">
                <i class="bi bi-person-circle me-1"></i>
                <strong th:text="${usuarioLogado.nome}">Admin</strong>
            </span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="bi bi-box-arrow-right me-1"></i> Sair
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gerenciar Cardápio</h1>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Formulário de Cadastro / Edição -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold"
                     th:text="${editando != null and editando} ? 'Editar Item' : 'Novo Item do Cardápio'">
                    Novo Item do Cardápio
                </div>
                <div class="card-body">
                    <form th:action="${editando != null and editando} ? @{/admin/cardapio/atualizar/{id}(id=${itemForm.id})} : @{/admin/cardapio/salvar}"
                          th:object="${itemForm}"
                          method="post">

                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label">Categoria</label>
                            <input type="text" id="categoria" th:field="*{categoria}" class="form-control"
                                   list="categoriasSugeridas" placeholder="Ex.: Pizzas, Bebidas, Sobremesas" required>
                            <datalist id="categoriasSugeridas">
                                <option value="Pizzas">
                                <option value="Porções">
                                <option value="Bebidas">
                                <option value="Sobremesas">
                            </datalist>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço (R$)</label>
                            <input type="number" id="preco" th:field="*{preco}" class="form-control"
                                   step="0.01" min="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label for="descricao" class="form-label">Descrição</label>
                            <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="disponivel" th:field="*{disponivel}">
                            <label class="form-check-label" for="disponivel">Disponível para pedidos</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger flex-grow-1">
                                <i class="bi bi-save me-1"></i>
                                <span th:text="${editando != null and editando} ? 'Atualizar' : 'Cadastrar'">Cadastrar</span>
                            </button>
                            <a th:if="${editando != null and editando}"
                               th:href="@{/admin/cardapio}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabela de Itens -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white fw-bold">Itens Cadastrados</div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Disponibilidade</th>
                            <th class="text-end">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${itens}">
                            <td>
                                <div class="fw-semibold" th:text="${item.nome}">Item</div>
                                <small class="text-muted" th:text="${item.descricao}">Descrição</small>
                            </td>
                            <td><span class="badge bg-secondary" th:text="${item.categoria}">Categoria</span></td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(item.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                            <td>
                                <span th:if="${item.disponivel}" class="badge bg-success">Disponível</span>
                                <span th:unless="${item.disponivel}" class="badge bg-warning text-dark">Indisponível</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/cardapio/editar/{id}(id=${item.id})}"
                                       class="btn btn-sm btn-outline-primary"
                                       title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <form th:action="@{/admin/cardapio/disponibilidade/{id}(id=${item.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${item.disponivel} ? 'btn-outline-warning' : 'btn-outline-success'"
                                                th:title="${item.disponivel} ? 'Marcar indisponível' : 'Marcar disponível'">
                                            <i class="bi" th:classappend="${item.disponivel} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                        </button>
                                    </form>

                                    <form th:action="@{/admin/cardapio/excluir/{id}(id=${item.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Confirmar exclusão (ou desativação caso já tenha sido pedido)?');">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger"
                                                title="Excluir">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
